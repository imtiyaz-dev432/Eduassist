global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: flask
    static_configs:
      - targets:
          - 127.0.0.1:5000

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - 127.0.0.1:8080

  - job_name: redis
    static_configs:
      - targets:
          - 127.0.0.1:9121

  - job_name: postgres
    static_configs:
      - targets:
