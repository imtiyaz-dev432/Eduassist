groups:
  - name: basic-alerts
    rules:

      # =========================
      # PROMETHEUS
      # =========================

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus target is not responding."


      # =========================
      # SYSTEM / NODE
      # =========================

      - alert: HighMemoryUsage
        expr: |
          (
            1 -
            (
              node_memory_MemAvailable_bytes /
              node_memory_MemTotal_bytes
            )
          ) * 100 > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage has been above 80% for more than 1 minute."


      # =========================
      # FLASK
      # =========================

      - alert: FlaskAppDown
        expr: up{job="flask-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Flask application is down"
          description: "Flask app has been unreachable for more than 1 minute."


      - alert: HighFlask5xxRate
        expr: |
          (
            sum(
              rate(
                flask_http_request_exceptions_total{
                  job="flask-app",
                  status=~"5.."
                }[5m]
              )
            )
            /
            sum(
              rate(
                flask_http_request_total{
                  job="flask-app"
                }[5m]
              )
            )
          ) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High Flask 5xx error rate"
          description: "Flask 5xx error rate has been above 5% for more than 2 minutes."


      # =========================
      # CELERY
      # =========================

      - alert: CeleryWorkerDown
        expr: celery_active_worker_count == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Celery worker is down"
          description: "No active Celery worker has been detected for more than 1 minute."


      - alert: CeleryTaskFailureRateHigh
        expr: |
          sum(rate(celery_task_failed_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Celery task failures detected"
          description: "Celery tasks have been failing continuously for more than 2 minutes."


      - alert: CeleryQueueBacklogHigh
        expr: celery_queue_length{queue_name="celery"} > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue backlog is high"
          description: "Celery queue has had more than 10 pending tasks for over 5 minutes."


      - alert: CeleryTaskRuntimeHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(celery_task_runtime_bucket[5m])
            )
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery task runtime is high"
          description: "Celery task P95 runtime has been above 5 seconds for more than 5 minutes."


      - alert: CeleryTaskRetryRateHigh
        expr: |
          sum(rate(celery_task_retried_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery task retry rate is high"
          description: "Celery tasks have been continuously retrying for more than 5 minutes."


      # =========================
      # POSTGRESQL
      # =========================

      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL exporter cannot connect to the PostgreSQL database for more than 1 minute."


      - alert: PostgreSQLHighConnectionUsage
        expr: |
          (
            sum(pg_stat_database_numbackends)
            /
            pg_settings_max_connections
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL connection usage"
          description: "PostgreSQL is using more than 80% of its configured connection capacity for 5 minutes."


      - alert: PostgreSQLLongRunningTransaction
        expr: pg_stat_activity_max_tx_duration > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Long-running PostgreSQL transaction"
          description: "A PostgreSQL transaction has been running for more than 30 seconds."


      - alert: PostgreSQLLowCacheHitRatio
        expr: |
          100 *
          sum(rate(pg_stat_database_blks_hit[5m]))
          /
          (
            sum(rate(pg_stat_database_blks_hit[5m]))
            +
            sum(rate(pg_stat_database_blks_read[5m]))
          ) < 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low PostgreSQL cache hit ratio"
          description: "PostgreSQL cache hit ratio has remained below 90% for 5 minutes."