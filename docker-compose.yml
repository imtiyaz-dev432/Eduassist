version: '3.8'

services:
  alloy:
    image: grafana/alloy:latest
    container_name: eduassist-alloy
    ports:
      - "4318:4318"
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    networks:
      monitoring:
        ipv4_address: 172.20.0.30

  tempo:
    image: grafana/tempo:2.5.0
    container_name: eduassist-tempo
    ports:
      - "3200:3200"
    command:
      - "-config.file=/etc/tempo_config/tempo.yaml"
      - "-server.http-listen-port=3200"
    volumes:
      - ./monitoring/tempo:/etc/tempo_config
    networks:
      monitoring:
        ipv4_address: 172.20.0.10

  grafana:
    image: grafana/grafana:latest
    container_name: eduassist-grafana
    ports:
      - "3000:3000"
    networks:
      monitoring:
        ipv4_address: 172.20.0.20

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16