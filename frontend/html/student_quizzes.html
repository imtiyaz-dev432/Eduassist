<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Quizzes - EduAssist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/student_quizzes.css">
</head>
<body>

    <!-- Modern Owner-Style Top Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-brand">
                <span class="brand-icon">🎓</span>
                <span class="brand-text">EduAssist</span>
            </div>
            <span class="portal-badge">Student Portal</span>
        </div>

        <div class="nav-links">
            <a href="student_dashboard.html" class="nav-item">
                <span>📊</span> Dashboard
            </a>
            <a href="student_assignments.html" class="nav-item">
                <span>📝</span> My Assignments
            </a>
            <!-- Quizzes section active (blue highlight) -->
            <a href="student_quizzes.html" class="nav-item active">
                <span>❓</span> My Quizzes
            </a>
        </div>

        <div class="nav-right">
            <div class="user-chip">
                <div class="user-avatar">👨‍🎓</div>
                <span class="user-role">Student</span>
            </div>
            <button onclick="logoutStudent()" class="logout-btn" title="Logout">
                <span>Log Out</span>
                <span class="arrow">➔</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        
        <div class="header-banner">
            <h1>⏱️ My Quizzes</h1>
            <p>Test your knowledge with live quizzes given by your teachers.</p>
        </div>

        <div class="grid" id="quizGrid">
            <p class="status-text">Loading your quizzes...</p>
        </div>

    </div>

    <!-- External JS Link -->
    <script src="../js/student_quizzes.js"></script>
</body>
</html>
