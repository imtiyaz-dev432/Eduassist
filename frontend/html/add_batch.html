<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Batches - EduAssist</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" 
          crossorigin="anonymous" 
          referrerpolicy="no-referrer" />

    <!-- External CSS Link -->
    <link rel="stylesheet" href="../css/add_batch.css">
</head>
<body>
    
    <!-- Decorative Glow Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <!-- Global Navigation Bar -->
    <nav class="global-navbar">
        <div class="nav-brand">🎓 EduAssist</div>
        <div class="nav-links">
              <a href="owner_dashboard.html" >Dashboard</a>
            <a href="add_institute.html">Institute</a>
            <a href="add_course.html"  id="navCourseLink">Courses</a>
            <a href="add_batch.html" id="navBatchLink" style="color: #0ea5e9; font-weight: 700; border-bottom: 2.5px solid #0ea5e9; padding-bottom: 4px;">Batches</a>
            <a href="add_faq.html" >AI FAQs</a>
            <a href="manages_leads.html">Leads</a>
            <a href="chat_history.html" >Chat History</a>
        </div>
        <button id="globalLogoutBtn" class="nav-logout-btn">Logout</button>
    </nav>

    <!-- Sub Navbar -->

    <!-- Main Container -->
    <div class="dashboard-container">
        
        <!-- TOP SECTION: ADD BATCH FORM -->
        <div class="card form-card">
            <h3>Step 4: Create Batches</h3>
            <p class="subtitle">Assign a Teacher and a Course to create a new Batch.</p>
            
            <p id="formMessage" class="message"></p>
            
            <form id="batchForm">
                <div class="form-grid">
                    
                    <div class="input-group full-width">
                        <label>Batch Name *</label>
                        <input type="text" id="batchName" placeholder="e.g. Morning Gladiators, Target NEET 2026" required>
                    </div>

                    <!-- COURSES DROPDOWN -->
                    <div class="input-group">
                        <label>Select Course *</label>
                        <select id="courseSelect" required>
                            <option value="">Loading courses...</option>
                        </select>
                    </div>

                    <!-- TEACHERS DROPDOWN -->
                    <div class="input-group">
                        <label>Assign Teacher *</label>
                        <select id="teacherSelect" required>
                            <option value="">Loading teachers...</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Start Time *</label>
                        <input type="time" id="startTime" required>
                    </div>

                    <div class="input-group">
                        <label>End Time *</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>

                <div class="action-btn-group">
                    <button type="submit" class="submit-btn" id="saveBatchBtn">Create Batch</button>
                    <button type="button" class="cancel-btn" id="cancelEditBtn" style="display: none;" onclick="cancelEdit()">Cancel Edit</button>
                </div>
            </form>
        </div>

        <!-- BOTTOM SECTION: LIST OF BATCHES -->
        <div class="card list-card">
            <div class="list-header">
                <h3>Your Active Batches</h3>
                <button onclick="alert('Setup Complete! Going to Main Dashboard...')" class="next-step-btn">Finish Setup ➔</button>
            </div>
            
            <div id="batchesList" class="courses-list">
                <p class="loading-text">Loading batches...</p>
            </div>
        </div>

    </div>

    <!-- External JS Link -->
    <script src="../js/add_batch.js"></script>
</body>
</html>
