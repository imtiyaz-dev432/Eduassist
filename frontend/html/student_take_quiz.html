<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz - EduAssist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="../css/student_take_quiz.css">
</head>
<body>

    <nav class="exam-navbar">
        <div class="nav-brand">📝 Live Quiz</div>
        <button class="cancel-btn" onclick="window.history.back()">Exit Quiz</button>
    </nav>

    <div class="quiz-container">
        
        <!-- Loading State & Result State -->
        <div id="msgBox" class="message-box">
            <i class="fas fa-spinner fa-spin" style="font-size: 40px; color: #4facfe; margin-bottom: 15px;"></i>
            <h3>Loading questions...</h3>
        </div>

        <!-- Quiz Header -->
        <div id="quizHeaderInfo" class="quiz-header" style="display: none;">
            <h1 id="quizTitle" class="quiz-title">Quiz Title</h1>
            <div class="quiz-meta">
                <span id="quizTopic"><i class="fas fa-book"></i> Topic: ---</span>
                <span>|</span>
                <span id="quizDifficulty"><i class="fas fa-layer-group"></i> Difficulty: ---</span>
            </div>
        </div>

        <!-- Questions Form -->
        <form id="questionsForm" onsubmit="submitQuiz(event)">
            <div id="questionsList">
                <!-- Questions will be injected here via JS -->
            </div>

            <div class="submit-section">
                <button type="submit" class="submit-btn" id="finalSubmitBtn">Submit Quiz <i class="fas fa-paper-plane"></i></button>
            </div>
        </form>

    </div>

    <!-- External JS Link -->
    <script src="../js/student_take_quiz.js"></script>
</body>
</html>
