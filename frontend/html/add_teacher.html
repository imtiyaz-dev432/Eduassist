<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers - EduAssist</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" 
          crossorigin="anonymous" 
          referrerpolicy="no-referrer" />
    
    <!-- Theme Stylesheet -->
    <link rel="stylesheet" href="../css/add_teacher.css">
</head>
<body>
    
    <!-- Decorative Glow Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <!-- Global Navigation Bar -->
    <nav class="global-navbar">
        <div class="nav-brand">🎓 EduAssist</div>
        <div class="nav-links">
             <a href="owner_dashboard.html" >Dashboard</a>
            <a href="add_institute.html">Institute</a>
            <a href="add_course.html" id="navCourseLink">Courses</a>
            <a href="add_batch.html" id="navBatchLink">Batches</a>
            <a href="add_faq.html" >AI FAQs</a>
            <a href="manages_leads.html">Leads</a>
            <a href="chat_history.html">Chat History</a>
        </div>
        <button id="globalLogoutBtn" class="nav-logout-btn">Logout</button>
    </nav>

    <!-- Sub Navbar -->
    <nav class="navbar">
        <h2>EduAssist Setup</h2>
        <button onclick="window.location.href='add_institute.html'" class="back-btn">Back to Coachings</button>
    </nav>

    <!-- Main Container -->
    <div class="dashboard-container">
        
        <!-- Step Form Card -->
        <div class="card form-card">
            <h3>Step 2: Add Teachers</h3>
            <p class="subtitle">Add faculty members for your institute.</p>
            
            <p id="formMessage" class="message"></p>
            
            <form id="teacherForm">
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label>Teacher Name *</label>
                        <input type="text" id="teacherName" placeholder="e.g. Amit Kumar" required>
                    </div>

                    <div class="input-group">
                        <label>Phone Number *</label>
                        <input type="tel" id="teacherPhone" placeholder="10-digit mobile no." required pattern="[0-9]{10}">
                    </div>

                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="teacherEmail" placeholder="amit@example.com">
                    </div>
                </div>
 
                <div class="action-btn-group">
                    <button type="submit" class="submit-btn" id="saveTeacherBtn">💾 Save Teacher</button>
                    <button type="button" class="next-step-btn" id="nextCourseBtn" onclick="goToCourse()">Next: Add Course ➔</button>
                </div>
            </form>
        </div>

        <!-- Faculty List Card -->
        <div class="card list-card">
            <div class="list-header">
                <h3>Faculty Members</h3>
            </div>
            
            <div id="teachersList" class="data-list">
                <p class="loading-text">Loading teachers...</p>
            </div>
        </div>

    </div>

    <!-- Main Logic Script -->
    <script src="../js/add_teacher.js"></script>
</body>
</html>
