<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Management - Owner Portal</title>
    <link rel="stylesheet" href="../css/fee_management.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <h2>EduAssist</h2>
            <span class="badge">Owner Portal</span>
        </div>
        <div class="nav-actions">
            <a href="dashboard.html" class="nav-link">🏠 Dashboard</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Header & Search Section -->
        <div class="header-section">
            <div class="title-area">
                <h2>💰 Fee Management</h2>
                <p>Manage fee records for your students</p>
            </div>
            
            <div class="search-box">
                <input type="number" id="searchStudentId" placeholder="Enter Student ID" required>
                <button id="searchBtn" class="primary-btn">🔍 Load Fees</button>
            </div>
        </div>

        <p id="globalMessage" class="message" style="display: none;"></p>

        <!-- Fees Display Section (Hidden by default) -->
        <div id="feeSection" class="card" style="display: none;">
            <div class="card-header">
                <h3>Fee Records for Student ID: <span id="displayStudentId"></span></h3>
                <button id="addFeeBtn" class="success-btn">➕ Add New Fee</button>
            </div>

            <div class="table-responsive">
                <table class="fee-table">
                    <thead>
                        <tr>
                            <th>Total Fee</th>
                            <th>Paid Amount</th>
                            <th>Due Amount</th>
                            <th>Due Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="feeTableBody">
                        <!-- Fee rows will be generated here by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit Fee -->
    <div id="feeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 id="modalTitle">Add New Fee</h3>
            <p id="modalMessage" class="message" style="display: none;"></p>

            <form id="feeForm" autocomplete="off">
                <div class="input-group">
                    <label>Total Fee (₹)</label>
                    <input type="number" id="totalFee" placeholder="e.g. 50000" required min="1">
                </div>
                
                <div class="input-group">
                    <label>Paid Amount (₹)</label>
                    <input type="number" id="paidAmount" placeholder="e.g. 20000" required min="0">
                </div>
                
                <div class="input-group">
                    <label>Due Date</label>
                    <input type="date" id="dueDate">
                </div>

                <button type="submit" class="primary-btn w-100" id="saveFeeBtn">Save Fee Record</button>
            </form>
        </div>
    </div>

    <script src="../js/fee_management.js"></script>
</body>
</html>
