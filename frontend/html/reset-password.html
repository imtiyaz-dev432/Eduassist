<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!-- CSS ka path apne hisaab se set kar lijiye (wahi purani file) -->
    <link rel="stylesheet" href="../css/reset.css">
</head>
<body>

    <!-- Decorative background shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="auth-container">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter the OTP sent to your email/mobile and set a new password.</p>

        <div class="form-container">
            <form class="auth-form" id="resetForm" autocomplete="off">
                <!-- Dummy inputs to prevent browser autofill -->
                <input type="email" style="display:none" autocomplete="username">
                
                <!-- OTP Input -->
                <div class="input-group">
                    <span class="icon">🔢</span>
                    <input type="text" id="otp" placeholder="Enter 6-digit OTP" autocomplete="off" required>
                </div>
                
                <!-- New Password Input -->
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="newPassword" placeholder="Enter New Password" autocomplete="new-password" required>
                </div>
                
                <button type="submit" class="submit-btn" id="resetBtn">Reset Password</button>
            </form>
        </div>

        <!-- Message Display Area -->
        <p id="message" class="message-text"></p>

        <!-- Back to Login Link -->
        <div class="footer-link">
            Remembered your password? <a href="login.html">Back to Login</a>
        </div>
    </div>

    <!-- JS file link -->
    <script src="../js/reset.js"></script>
</body>
</html>
