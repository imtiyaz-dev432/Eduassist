<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!-- Wahi same CSS yahan bhi kaam karegi -->
    <link rel="stylesheet" href="../css/forgot.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Reset Password</h2>
            <p class="subtitle" id="userEmailDisplay">Enter OTP and new password.</p>
            
            <p id="messageBox" class="message"></p>

            <form id="resetForm">
                <div class="input-group">
                    <label>Enter 6-digit OTP</label>
                    <input type="text" id="resetOtp" maxlength="6" required>
                </div>
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="e.g. Admin@123" required>
                </div>
                <button type="submit" class="submit-btn" id="resetBtn">Update Password</button>
            </form>
        </div>
    </div>
    
    <script src="../js/reset.js"></script>
</body>
</html>
