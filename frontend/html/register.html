<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

    <!-- Decorative background shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="auth-container">
        <h2>Create Account</h2>
        <p class="subtitle">Fill in your details to get started</p>

    
        <p id="messageBox" style="text-align: center; margin-bottom: 15px; font-weight: 600; min-height: 20px; font-size: 14px;"></p>

        <div class="form-container">
            <!-- Form mein autocomplete="off" lagayein -->
            <form class="auth-form" id="registerForm" autocomplete="off">
                
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" id="regName" placeholder="Full Name" autocomplete="off" required>
                </div>
                
                <div class="input-group">
                    <span class="icon">✉️</span>
                    <input type="email" id="regEmail" placeholder="Email Address" autocomplete="off" required>
                </div>
                
                <div class="input-group">
                    <span class="icon">📱</span>
                    <input type="tel" id="regMobile" placeholder="Mobile Number" autocomplete="off" required>
                </div>
                
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="regPassword" placeholder="Strong Password" autocomplete="new-password" required>
                </div>
                
                <button type="submit" class="submit-btn">Register</button>
            </form>
        </div>

        <div class="footer-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>
    
    <script src="../js/register.js"></script>
</body>
</html>
