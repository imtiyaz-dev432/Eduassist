<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Quizzes - EduAssist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="../css/teacher_quizzes.css">
</head>
<body>
    
    <!-- Navbar -->
    <nav class="global-navbar">
        <div class="nav-brand">EduPanel — Quizzes</div>
        <button class="secondary-btn" onclick="window.location.href='teacher_dashboard.html'">Go to Dashboard</button>
    </nav>

    <!-- Main Container -->
    <div class="dashboard-container">
        
        <div class="welcome-banner">
            <div>
                <h1>Quiz Management</h1>
                <p>Create and manage MCQs for your batch</p>
            </div>
            <button class="primary-btn" onclick="openModal('addModal')"><i class="fas fa-plus"></i> Create New Quiz</button>
        </div>

        <div class="section-card">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Topic</th>
                        <th>Difficulty</th>
                        <th>Max Marks</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="quizTableBody">
                    <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Quiz Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2 style="margin-bottom:20px;">New Quiz</h2>
            <form id="addForm" onsubmit="addQuiz(event)">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" class="form-input" id="a_title" required>
                </div>
                <div class="form-group">
                    <label>Topic</label>
                    <input type="text" class="form-input" id="a_topic">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Difficulty</label>
                        <select class="form-input" id="a_diff">
                            <option>Easy</option>
                            <option>Medium</option>
                            <option>Hard</option>
                            <option>Very Hard</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Total Marks</label>
                        <input type="number" class="form-input" id="a_marks" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select class="form-input" id="a_status">
                        <option>Draft</option>
                        <option>Active</option>
                        <option>Closed</option>
                    </select>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" class="secondary-btn" onclick="closeModal('addModal')">Cancel</button>
                    <button type="submit" class="primary-btn">Save Quiz</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Quiz Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2 style="margin-bottom:20px;">Edit Quiz</h2>
            <form id="editForm" onsubmit="editQuiz(event)">
                <input type="hidden" id="e_id">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" class="form-input" id="e_title" required>
                </div>
                <div class="form-group">
                    <label>Topic</label>
                    <input type="text" class="form-input" id="e_topic">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Difficulty</label>
                        <select class="form-input" id="e_diff">
                            <option>Easy</option>
                            <option>Medium</option>
                            <option>Hard</option>
                            <option>Very Hard</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Total Marks</label>
                        <input type="number" class="form-input" id="e_marks" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select class="form-input" id="e_status">
                        <option>Draft</option>
                        <option>Active</option>
                        <option>Closed</option>
                    </select>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" class="secondary-btn" onclick="closeModal('editModal')">Cancel</button>
                    <button type="submit" class="primary-btn">Update Quiz</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- External JS Link -->
    <script src="../js/teacher_quizzes.js"></script>
</body>
</html>
