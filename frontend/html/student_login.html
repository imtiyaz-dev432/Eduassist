<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <!-- Standard Blue Theme CSS -->
    <link rel="stylesheet" href="../css/student_login.css">
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="login-container">
        <div class="auth-container">
            <h2>EduAssist</h2>
            <p class="subtitle">Student Portal Login</p>
            
            <p id="loginMessage" class="message"></p>

            <form id="studentLoginForm" autocomplete="off">
                <div class="input-group">
                    <span class="icon">🎓</span>
                    <input type="text" id="loginId" autocomplete="nope" placeholder="Email ID or Phone Number" required>
                </div>

                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" autocomplete="new-password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="submit-btn" id="loginBtn">Login as Student</button>
            </form>

            <div class="footer-link">
                <p>Are you a Teacher? <a href="teacher_login.html">Teacher Portal</a></p>
            </div>
        </div>
    </div>

    <script src="../js/student_login.js"></script>
</body>
</html>
