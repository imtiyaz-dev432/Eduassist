<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <!-- CSS path bilkul sahi hai -->
    <link rel="stylesheet" href="../css/forgot.css">
</head>
<body>

    <!-- Decorative background shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="auth-container">
        <h2>Forgot Password?</h2>
        <p class="subtitle">Enter your registered email or mobile number to receive an OTP.</p>

        <div class="form-container">
            <form class="auth-form" id="forgotForm" autocomplete="off">
                <!-- Dummy inputs to prevent browser autofill -->
                <input type="email" style="display:none" autocomplete="username">
                
                <!-- Email or Mobile Input -->
                <div class="input-group">
                    <span class="icon">🔍</span>
                    <input type="text" id="identifier" placeholder="Email OR Mobile Number" autocomplete="off" required>
                </div>
                
                <button type="submit" class="submit-btn" id="forgotBtn">Send OTP</button>
            </form>
        </div>

        <!-- Message Display Area -->
        <p id="message" class="message-text"></p>

        <!-- Back to Login Link -->
        <div class="footer-link">
            Remembered your password? <a href="login.html">Back to Login</a>
        </div>
    </div>

    <!-- YAHAN CHANGE KIYA HAI: login.js ki jagah forgot.js aayega -->
    <script src="../js/forgot.js"></script>
</body>
</html>
