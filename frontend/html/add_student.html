<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - EduAssist</title>
    <!-- External CSS Link -->
    <link rel="stylesheet" href="../css/add_student.css">
</head>
<body>
    
    <!-- Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <!-- --- Global Navigation Bar --- -->
    <nav class="global-navbar">
        <div class="nav-brand">🎓 EduAssist</div>
        <div class="nav-links">
           <a href="add_institute.html">Institute</a>
            <a href="add_course.html" id="navCourseLink">Courses</a>
            <a href="add_batch.html" id="navBatchLink">Batches</a>
            <a href="add_faq.html" >AI FAQs</a>
            <a href="manages_leads.html">Leads</a>
            <a href="chat_history.html">Chat History</a>
        </div>
        <button id="globalLogoutBtn" class="nav-logout-btn">Logout</button>
    </nav>

    <!-- Page Specific Navbar -->
    <nav class="navbar">
        <h2>EduAssist - Student Management</h2>
        <!-- User ko wapas pichle page par bhejne ke liye -->
        <button onclick="window.history.back()" class="back-btn">⬅ Back to Batches</button>
    </nav>

    <div class="dashboard-container">
        
        <!-- TOP SECTION: ADD/UPDATE STUDENT FORM -->
        <div class="card form-card">
            <h3 id="formTitle">Enroll New Student</h3>
            <p class="subtitle" id="formSubtitle">Fill in the details to add a student to this batch.</p>
            
            <p id="formMessage" class="message"></p>
            
            <form id="studentForm">
                <div class="form-grid">
                    
                    <div class="input-group">
                        <label>Student Name *</label>
                        <input type="text" id="studentName" placeholder="e.g. Rahul Sharma" required>
                    </div>

                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="studentEmail" placeholder="rahul@example.com">
                    </div>

                    <div class="input-group">
                        <label>Student Phone *</label>
                        <input type="tel" id="studentPhone" placeholder="10-digit mobile no." required pattern="[0-9]{10}">
                    </div>

                    <div class="input-group">
                        <label>Parent Phone</label>
                        <input type="tel" id="parentPhone" placeholder="Optional" pattern="[0-9]{10}">
                    </div>

                    <div class="input-group">
                        <label>Admission Date</label>
                        <input type="date" id="admissionDate">
                    </div>

                    <div class="input-group">
                        <label>Status *</label>
                        <select id="studentStatus" required>
                            <option value="Active" selected>Active</option>
                            <option value="Inactive">Inactive</option>
                            <option value="Completed">Completed</option>
                            <option value="Dropped">Dropped</option>
                        </select>
                    </div>

                    <div class="input-group full-width">
                        <label>Address</label>
                        <textarea id="studentAddress" rows="2" placeholder="Enter full address..."></textarea>
                    </div>
                </div>
 
                <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button type="submit" class="submit-btn" id="saveStudentBtn">Enroll Student</button>
                    <button type="button" class="cancel-btn" id="cancelEditBtn" style="display: none;" onclick="cancelEdit()">Cancel Edit</button>
                </div>
            </form>
        </div>

        <!-- BOTTOM SECTION: LIST OF STUDENTS -->
        <div class="card list-card" style="margin-top: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Enrolled Students</h3>
            </div>
            
            <div id="studentsList" class="data-list">
                <p style="text-align: center; color: #6b7280;">Loading students...</p>
            </div>
        </div>

    </div>

    <!-- External Script File -->
    <script src="../js/add_student.js"></script>
</body>
</html>
