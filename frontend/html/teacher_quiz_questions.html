<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Questions - EduAssist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="../css/quiz_questions.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="global-navbar">
        <div class="nav-brand">EduPanel — Question Manager</div>
        <button class="secondary-btn" onclick="window.history.back()">⬅ Back to Quizzes</button>
    </nav>

    <!-- Main Content -->
    <div class="dashboard-container">
        <div class="welcome-banner">
            <div>
                <h1 style="font-size:24px; color:#1f2937; margin-bottom: 5px;">Manage Quiz Questions</h1>
                <p style="color:#6b7280; font-size:14px;">Add, edit and manage MCQs for the selected quiz.</p>
            </div>
            <button class="primary-btn" onclick="openModal('addModal')"><i class="fas fa-plus"></i> Add New Question</button>
        </div>

        <div id="questionsContainer">
            <p style="text-align:center; color:#6b7280; padding: 40px; background: white; border-radius: 12px;">Loading questions...</p>
        </div>
    </div>

    <!-- Modal: Add Question -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2 style="margin-bottom:20px; color: #1f2937;">Add New MCQ</h2>
            <form id="addForm" onsubmit="addQuestion(event)">
                <div class="form-group">
                    <label>Question Text *</label>
                    <textarea class="form-input" id="a_q" required rows="3" placeholder="Write your question here..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Option A *</label><input type="text" class="form-input" id="a_a" required></div>
                    <div class="form-group"><label>Option B *</label><input type="text" class="form-input" id="a_b" required></div>
                    <div class="form-group"><label>Option C *</label><input type="text" class="form-input" id="a_c" required></div>
                    <div class="form-group"><label>Option D *</label><input type="text" class="form-input" id="a_d" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Correct Answer *</label>
                        <select class="form-input" id="a_correct">
                            <option value="A">Option A</option>
                            <option value="B">Option B</option>
                            <option value="C">Option C</option>
                            <option value="D">Option D</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Marks *</label><input type="number" class="form-input" id="a_marks" value="1" required min="1" max="100"></div>
                </div>
                <div class="form-group">
                    <label>Explanation (Optional)</label>
                    <textarea class="form-input" id="a_exp" rows="2" placeholder="Why is this answer correct?"></textarea>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:12px; margin-top: 10px;">
                    <button type="button" class="secondary-btn" onclick="closeModal('addModal')">Cancel</button>
                    <button type="submit" class="primary-btn">Save Question</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Edit Question -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2 style="margin-bottom:20px; color: #1f2937;">Edit MCQ</h2>
            <form id="editForm" onsubmit="editQuestion(event)">
                <input type="hidden" id="e_id">
                <div class="form-group">
                    <label>Question Text *</label>
                    <textarea class="form-input" id="e_q" required rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Option A *</label><input type="text" class="form-input" id="e_a" required></div>
                    <div class="form-group"><label>Option B *</label><input type="text" class="form-input" id="e_b" required></div>
                    <div class="form-group"><label>Option C *</label><input type="text" class="form-input" id="e_c" required></div>
                    <div class="form-group"><label>Option D *</label><input type="text" class="form-input" id="e_d" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Correct Answer *</label>
                        <select class="form-input" id="e_correct">
                            <option value="A">Option A</option>
                            <option value="B">Option B</option>
                            <option value="C">Option C</option>
                            <option value="D">Option D</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Marks *</label><input type="number" class="form-input" id="e_marks" required min="1" max="100"></div>
                </div>
                <div class="form-group">
                    <label>Explanation (Optional)</label>
                    <textarea class="form-input" id="e_exp" rows="2"></textarea>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:12px; margin-top: 10px;">
                    <button type="button" class="secondary-btn" onclick="closeModal('editModal')">Cancel</button>
                    <button type="submit" class="primary-btn">Update Question</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- External JS Link -->
    <script src="../js/quiz_questions.js"></script>
</body>
</html>
