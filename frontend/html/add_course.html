<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management - EduAssist</title>
    <!-- Linked External CSS -->
    <link rel="stylesheet" href="../css/add_course.css">
</head>
<body>
    
    <!-- Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <!-- Global Navigation Bar -->
    <nav class="global-navbar">
        <div class="nav-brand">🎓 EduAssist</div>
        <div class="nav-links">
              <a href="owner_dashboard.html" >Dashboard</a>
            <a href="add_institute.html">Institute</a>
            <a href="add_course.html" style="color: #0ea5e9; font-weight: 700; border-bottom: 2.5px solid #0ea5e9; padding-bottom: 4px;" id="navCourseLink">Courses</a>
            <a href="add_batch.html" id="navBatchLink">Batches</a>
            <a href="add_faq.html" >AI FAQs</a>
            <a href="manages_leads.html">Leads</a>
            <a href="chat_history.html" >Chat History</a>
        </div>
        <button id="globalLogoutBtn" class="nav-logout-btn">Logout</button>
    </nav>

    <div class="dashboard-container">
        
        <!-- TOP SECTION: FORM -->
        <div class="card form-card">
            <h3 id="formTitle">Add New Course / Program</h3>
            <p class="subtitle" id="formSubtitle">Define the course details you offer at this institute.</p>
            
            <p id="formMessage" class="message" style="display: none;"></p>
            
            <form id="courseForm">
                <div class="form-grid">
                    <!-- Basic Fields -->
                    <div class="input-group">
                        <label>Course Name *</label>
                        <input type="text" id="courseName" required>
                    </div>
                    <div class="input-group">
                        <label>Category</label>
                        <input type="text" id="courseCategory">
                    </div>
                    <div class="input-group">
                        <label>Total Fee (₹)</label>
                        <input type="number" id="courseFee">
                    </div>
                    <div class="input-group">
                        <label>Duration</label>
                        <input type="text" id="courseDuration">
                    </div>
                    <div class="input-group">
                        <label>Mode</label>
                        <select id="courseMode">
                            <option value="Offline">Offline (Classroom)</option>
                            <option value="Online">Online (Live/Recorded)</option>
                            <option value="Hybrid">Hybrid</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Difficulty Level</label>
                        <select id="courseLevel">
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                            <option value="All Levels">All Levels</option>
                        </select>
                    </div>
                    <div class="input-group full-width">
                        <label>Eligibility Criteria</label>
                        <input type="text" id="courseEligibility">
                    </div>
                    <div class="input-group full-width">
                        <label>Short Description</label>
                        <textarea id="courseDescription" rows="2"></textarea>
                    </div>
                    <div class="input-group full-width">
                        <label>Syllabus Link / Highlights</label>
                        <input type="text" id="courseSyllabus">
                    </div>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-container">
                        <input type="checkbox" id="certAvailable">
                        <span class="checkmark"></span>
                        Certificate Available
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="placementSupport">
                        <span class="checkmark"></span>
                        Placement Support
                    </label>
                </div>

                <div style="display: flex; gap: 15px;">
                    <button type="submit" class="submit-btn" id="saveCourseBtn">Save Course</button>
                    <!-- Yeh button tab aayega jab hum Edit kar rahe honge -->
                    <button type="button" class="cancel-btn" id="cancelEditBtn" style="display: none;" onclick="cancelEdit()">Cancel Edit</button>
                </div> 
            </form>
        </div>

        <!-- LIST SECTION -->
        <div class="card list-card" style="margin-top: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Your Added Courses</h3>
                <button onclick="goToBatches()" class="next-step-btn">Next Step: Add Batches ➔</button>
            </div>
            
            <div id="coursesList" class="courses-list">
                <p style="text-align: center; color: #6b7280;">Loading courses...</p>
            </div> 
        </div>

    </div>

    <!-- Linked External JS -->
    <script src="../js/add_course.js"></script>
</body>
</html>
