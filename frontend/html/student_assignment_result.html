<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Result - EduAssist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="../css/assignment_result.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="global-navbar">
        <div class="nav-brand">EduPanel — Student Portal</div>
        <button class="secondary-btn" onclick="window.history.back()">⬅ Back to Assignments</button>
    </nav>

    <div class="dashboard-container">
        
        <!-- Loading State -->
        <div id="loadingState" class="loading-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Fetching your result...</p>
        </div>

        <!-- Pending State (Agar teacher ne check nahi kiya) -->
        <div id="pendingState" class="status-message pending-state">
            <i class="fas fa-clock"></i>
            <h2>Evaluation Pending</h2>
            <p>Your teacher has not checked this assignment yet. Please check back later!</p>
        </div>

        <!-- Error State (Agar submit nahi kiya ya error aaya) -->
        <div id="errorState" class="status-message error-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h2 id="errorTitle">Oops!</h2>
            <p id="errorMessage">Something went wrong.</p>
        </div>

        <!-- Main Result Card (Checked ho jane par) -->
        <div id="resultCard" class="result-card">
            <div class="result-header">
                <h1 id="assignTitle">Assignment Title</h1>
                <span class="badge-checked"><i class="fas fa-check-circle"></i> Checked & Graded</span>
            </div>
            
            <div class="result-body">
                <div class="score-section">
                    <h3>Marks Awarded</h3>
                    <div class="score-circle" id="assignMarks">
                        --
                    </div>
                </div>

                <div class="feedback-section">
                    <h3><i class="fas fa-comment-dots" style="color: #8b5cf6;"></i> Teacher's Feedback</h3>
                    <p id="assignFeedback">No feedback provided.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- External JS Link -->
    <script src="../js/assignment_result.js"></script>
</body>
</html>
