<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students & Attendance - EduAssist</title>
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="../css/view_student.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <h2>EduAssist</h2>
            <span class="badge">Teacher Portal</span>
        </div>
        <a href="teacher_dashboard.html" class="back-btn">⬅ Back to Dashboard</a>
    </nav>

    <!-- Main Container -->
    <div class="container">
        
        <div class="header-box">
            <div>
                <h2 id="batchNameDisplay">Loading Batch...</h2>
                <p class="subtitle">Mark Present (P) or Absent (A) for students below.</p>
            </div>
            <div>
                <label style="font-weight: 600; margin-right: 10px;">Date: </label>
                <input type="date" id="attendanceDate" class="date-picker">
            </div>
        </div>

        <div class="table-box">
            <p id="msgBox" class="msg-box"></p>
            
            <table>
                <thead>
                    <tr>
                        <th>Roll / ID</th>
                        <th>Student Name</th>
                        <th>Contact</th>
                        <th>Mark Attendance</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentBody">
                    <tr><td colspan="5" style="text-align: center; padding: 20px;">Loading students...</td></tr>
                </tbody>
            </table>
            
            <button class="save-btn" id="saveBtn">💾 Save Attendance</button>
        </div>
    </div>

    <!-- History & Edit Modal (Hidden by Default) -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="modalStudentName" style="color: #1f2937;">Attendance History</h3>
                <button onclick="closeModal()" class="close-btn">&times;</button>
            </div>
            
            <table style="margin-top: 0;">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Remarks</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- History rows will load here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- External JS Link -->
    <script src="../js/view_student.js"></script>
</body>
</html>
